# Hand-written inputs for scripts/gen-readme.ts. Everything else in README.md
# comes from the code. Placeholders only, never a real host, path, or vault item.
package: "@jpisgeek/hyperv"
purpose: >-
  A Hyper-V host, read over SSH and acted on deliberately. `discover` is
  read-only and covers the host's capacity, one record per virtual machine,
  and one per virtual switch. Checkpoints are recorded by the checkpoint
  methods rather than by `discover`, so a checkpoint record reflects a
  deliberate act on that VM and not a periodic sweep. Lifecycle methods
  mutate, and each destructive one makes the caller name what it is about to
  destroy. There is no REST or JSON-RPC surface for Hyper-V, so PowerShell is
  the API and SSH is how it is reached.
example: |
  globalArguments:
    # Source both from a vault so no machine identity lands in a tracked file.
    host: ${{ vault.get(<your-vault>, <your-host-address-item>) }}
    user: ${{ vault.get(<your-vault>, <your-host-user-item>) }}
    port: 22
    timeoutSec: 30
caveats: |
  **Authentication is the ambient ssh-agent.** Load an identity the target
  authorizes before running anything here. This model never handles key
  material, never reads a key file, and takes no password argument. With no
  agent reachable the SSH call fails, which is the intended outcome rather
  than a quiet fallback to something weaker.

  **The Windows sshd's default shell is `cmd.exe`.** Anything with a quote,
  pipe, or brace gets mangled twice before PowerShell ever sees it, so
  commands are sent with `-EncodedCommand` as base64 UTF-16LE. This is not
  premature: a literal pipe in a remote command has already truncated a script
  and left a file half-written.

  **Three .NET serialisation traps are resolved host-side, not here.** VM
  `State` is an enum number, so a stopped VM reports `3`, not `"Off"`.
  `SecureBoot` is also an enum where **0 means ON**, so reading it as a boolean
  reports the security posture backwards. `CreationTime` arrives as
  `/Date(1234567890000)/`. Each parses cleanly into something wrong, which is
  the dangerous kind of wrong, so all three are resolved in PowerShell rather
  than decoded here against a table that drifts as Microsoft adds values.

  `ConvertTo-Json` returns an object for one item and an array for many, so
  the remote side is always told to emit an array. Code that assumes one shape
  breaks the first time the count changes.
security: |
  **Transport.** SSH to the host's OpenSSH server, authenticated by whatever
  identity the ambient agent holds. No credential is read, stored, or accepted
  as an argument.

  **What is written.** Summaries only: names, states, capacity, switch types,
  checkpoint names and timestamps. No device contents, no console credentials,
  no guest filesystem data.

  **What mutates, and what stops it.** `start` and `stop` change run state;
  `stop --force` cuts power and risks the guest filesystem exactly as pulling
  the plug would, and says so when used. `checkpoint` and `removeCheckpoint`
  add and drop restore points. Two methods can destroy work that cannot be
  recovered, and both require an explicit acknowledgement that repeats the
  target's name:

  - `delete` removes the machine and its checkpoints, and needs `confirmName`
    to equal `vmName` exactly. `deleteDisks` is off by default, because
    Hyper-V's own `Remove-VM` leaves disks behind and destroying them silently
    would be harsher than the platform's own default.
  - `restoreCheckpoint` discards every change made since the checkpoint was
    taken. That loss is silent — Hyper-V does not warn and there is no undo —
    so `confirmDiscardSince` must repeat the checkpoint name.
  - Deleting a **running** VM cuts its power: this path has no graceful
    shutdown, and the guest filesystem takes the same risk as pulling the
    plug. It is refused unless `confirmForcePowerOff` is set, so the power cut
    is a decision rather than a side effect of the delete.

  When `deleteDisks` is used, each file is removed and then verified absent,
  and any disk that survives fails the method. Failures are reported by
  position, never by path — a disk path names a volume layout and usually the
  VM, and these messages reach logs and stored resources.

  The point of both guards is a `vmName` arriving from a workflow input: it
  should fail rather than succeed against the wrong machine.

  **Verification, not exit codes.** `start`, `stop`, and `checkpoint` read the
  resulting state back rather than trusting the cmdlet's exit status.
