package: "@jpisgeek/inventory-coverage"
purpose: >-
  Assesses coverage of fixed operational metadata v1, with its model-scope
  coverage report. Uses bounded counts, boolean/null flags, enumerated collector
  outcome and observation time, not caller-selected fields or conditions.
  It never probes backends or assumes retained evidence proves current health.
  Shared code comes from @jpisgeek/documentation-evidence, an intentionally
  public MIT sibling package in this repository, not a private deployment name.
example: |
  globalArguments:
    maxAgeSeconds: 3600
    sources:
      - category: storage
        modelType: '@example/operational-metadata'
        modelId: 00000000-0000-4000-8000-000000000001
        dataName: summary
  reports:
    require:
      - '@jpisgeek/inventory-coverage'
caveats: |
  A trusted producer must write exactly this metadata JSON (all keys required):

  ```json
  {
    "schemaVersion": 1,
    "observedAt": "2026-10-14T12:00:00.123Z",
    "collectorStatus": "succeeded",
    "counts": { "expected": 9, "observed": 9, "unhealthy": 2, "unknown": 0 },
    "flags": { "reachable": false, "configured": true }
  }
  ```

  Counts are integers 0-1,000,000; observed cannot exceed expected; unhealthy
  plus unknown cannot exceed observed (disjoint subsets). Outcome is succeeded,
  failed or unknown. Flags are booleans or null. Time is null or a valid UTC ISO
  timestamp with exactly three fractional-second digits. Every object is strict:
  extra/missing keys, free text, unsupported enums, coerced values, arbitrary
  field selection and legacy zeroFields/trueFields/falseFields are rejected.
  Duplicate decoded JSON keys, including escape-equivalent names, are rejected
  at every object depth; nesting is limited to 16. UUIDs must be canonical lowercase.
  Raw evidence rejects the reserved `__proto__` member (including escaped names)
  before Zod parsing. Source items are checked before their object parser;
  capture also checks the own keys of the globals it receives. On Swamp c5d1db96,
  definition ingestion can discard a root `__proto__` configuration key before
  this extension sees it; it cannot attest rejection of that original text.
  Such a key still rejects if present at the execution boundary. Declare source
  routes as complete items, not CEL paths descending through the source-item
  schema: its preprocessing wrapper is not traversed by this Swamp version's
  schema-path introspection. Root argument routing/coercion and output attribute
  schemas remain native. Exported object schemas describe the contract, not a
  substitute for the raw-byte capture/report boundary.
  Capture accepts no method inputs: its empty finite-key record schema
  keeps Swamp's global-argument merging separate from method-input validation.
  Raw collector resources need a separately reviewed fixed mapping, not an
  arbitrary projection. The unpublished projection draft is not supported.

  Run capture to write the summary named summary. Each source pins its latest
  exact named version without model-wide enumeration. Missing/deleted/empty data is unavailable.
  Unreadable, malformed, oversized, invalid-schema, invalid-size-metadata or unversioned data is error. Both leave condition
  unknown and cannot make coverage complete; other sources are preserved.
  Valid null/future observation time yields freshness unknown; invalid timestamp
  syntax is a schema error. Resource creation/capture time never substitutes.
  Age exactly at maxAgeSeconds is fresh; one millisecond older is stale.
  maxAgeSeconds is an integer from 1 to 31,536,000, default 3600. Freshness is as
  of assessedAt, not report retrieval time, and says nothing about a later run.

  Failed outcome, unhealthy > 0, reachable false or configured false means
  degraded, even when other facts are unknown. Otherwise unknown outcome,
  observed < expected, unknown > 0 or null flags means condition unknown;
  otherwise clear. A row is complete only if fresh, outcome succeeded, observed
  equals expected, unknown is zero and both flags are known. Coverage complete
  means every row complete, NOT healthy: explicit degradation can be complete
  evidence. A failed collector is never complete even with a recent timestamp.
  Reports recompute and validate derived fields/counters and read only the
  successful capture's exact summary version, with no fallback.

  Categories are compute, storage, network, applications, automation and
  documentation, one source per category (1-6). Source UUID/type/name routing
  is unique across categories: the same resource cannot satisfy two categories.
  It follows @jpisgeek/documentation-evidence's contract and is not copied into outputs.
  UUID must have exactly one definition of the declared type; missing or copied
  same-type definitions produce an error row. Rename redirects are rejected. Recorded sizes
  must be integers 0-64,000 before streaming. Source/report streams accumulate
  at most 64,000 bytes inside this extension; overflow or a final size differing
  from metadata is an error, never truncation. Each stream permits at most
  64,000 chunks, including empty chunks, and yields to tasks every 64 chunks
  so immediately resolved streams cannot starve cancellation/deadline timers.
  Exhausting this no-progress/chunk budget is an error. This is NOT a whole-platform
  allocation bound: Swamp may buffer metadata, scan definitions to resolve a UUID, enumerate versions without a
  latest marker, hydrate content or buffer remote-worker artifacts before yielding.
  The repository/backend and metadata writers are trusted; attacker-controlled
  storage is unsupported. Backend quotas/isolation are the operator's responsibility.
  Filesystem backend tested; hydration and remote-worker allocation not tested
  or claimed bounded. Requires definitionRepository.findAllByIdGlobal and
  dataRepository.findByName/stream; unsupported contexts fail rather than using
  unbounded fallback reads. Each definition lookup has a 30-second caller-wait
  deadline; each metadata-plus-content read has a separate 30-second deadline,
  not renewed by chunks. A timeout is an error row; caller cancellation rejects
  pending reads promptly and is never converted to a row. Iterator closure is
  requested, not awaited indefinitely. These APIs cannot cancel backend work;
  pending reads/close may continue. Backend timeouts/quotas remain necessary.
  Writes are platform-owned, outside this read deadline; abort cannot roll back
  data persisted during a write. Malformed
  UTF-8 and numeric rounding/underflow/non-finite/negative-zero evidence is an
  error. Numeric parsing requires JSON reviver source-context support. Retention
  is 30 days and at most 30 versions. Pure-data tests cover macOS ARM64 and
  Linux x86_64; this does not claim live-backend integration or compatibility.
security: >-
  No network, subprocess, environment or vault access; only configured stored
  resources are read. MIT fixed-contract code is bundled from this repository's
  @jpisgeek/documentation-evidence source, with no separate runtime installation. No
  arbitrary text/labels/selectors are accepted in evidence; routing stays in
  configuration. Schema validation is NOT a universal secret detector: a writer
  could encode information in allowed numbers/times/flags or lie about success.
  Trust/review producers and protect definitions, source evidence, summaries and
  both report formats. Nothing is auto-published. Errors are sanitized and
  cancellation is not converted to a row. Storage write failures fail capture;
  a source error row is explicit incomplete evidence, not a passing probe.
