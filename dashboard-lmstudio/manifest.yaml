manifestVersion: 1
name: "@jpisgeek/dashboard-lmstudio"
version: 2026.08.25.3
description: >
  Provider-neutral dashboard adapter for @jpisgeek/lmstudio endpoint,
  headless daemon, and per-request probes. Preserves reachability,
  authorization, loaded models, model capability,
  finish reason, token usage, context exhaustion, output limits, and timing
  without presenting instrumented requests as aggregate accounting.
repository: https://github.com/jpisgeek/slog-bog/tree/main/dashboard-lmstudio
paths:
  base: manifest
models: []
workflows: []
vaults: []
drivers: []
datastores: []
reports:
  - dashboard_lmstudio.ts
additionalFiles:
  - README.md
  - LICENSE
platforms:
  - darwin-aarch64
  - linux-x86_64
labels:
  - dashboard
  - observability
  - lmstudio
  - local-inference
dependencies: []
