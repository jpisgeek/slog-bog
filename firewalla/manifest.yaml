manifestVersion: 1
name: "@jpisgeek/firewalla"
version: 2026.08.22.2
description: >
  Device and machine inventory from the Firewalla MSP API. The firewall is the authoritative view of a network because it knows every device ever seen, including ones currently offline, which no amount of scanning reveals. Emits one device resource per device, one machine resource per deduplicated host with its NICs collapsed, and an inventory roll-up. The MSP token is supplied at runtime via vault.get().
