package: "@jpisgeek/proton-pass"
types: []
purpose: >-
  Proton Pass as a swamp vault provider. `${{ vault.get('<vault>', 'KEY') }}`
  resolves live through the official `pass-cli` at run time. Secrets stay in
  Proton Pass and are never copied into swamp storage, this repository, or
  disk. For people who keep their lives in the Proton ecosystem and want
  swamp to read credentials from the same place everything else does.
example: |
  # vaults/proton.yaml
  type: "@jpisgeek/proton-pass"
  name: proton
  config:
    vaultName: homelab        # the Proton Pass vault to read from
    defaultField: password    # field used when a key names none
    # binary: /opt/homebrew/bin/pass-cli   # optional; resolved on PATH + known prefixes otherwise

  # Then in any model:
  #   apiKey: ${{ vault.get('proton', 'Example Service/API Key') }}
  # Key forms:
  #   "Item Title"                 -> that item, field = defaultField
  #   "Item Title/fieldname"       -> explicit field on that item
  #   "pass://SHARE_ID/ITEM_ID"    -> stable URI; survives item renames (preferred for anything long-lived)
caveats: >-
  Requires the Proton Pass CLI (`brew install proton-pass-cli`) and a usable
  session (`pass-cli login`, or a personal access token for unattended runs).
  On macOS the CLI's database key lives in the login Keychain, so `get()` works
  from a GUI login session or a LaunchAgent in that session, not over plain
  ssh, from a LaunchDaemon, or from cron. Item titles can be edited in the
  Proton Pass UI; item IDs cannot, so prefer `pass://` URIs for anything that
  must not break when someone renames an item. `put()` creates a new login
  item each call (no update-in-place) and passes the value as a CLI argument,
  which is visible in the process list to other local users for the duration
  of the call. Prefer creating items in the Proton Pass UI and reading them
  with `get()`.
security: >-
  Every `get()` is a live lookup; no value is cached, logged, or persisted.
  pass-cli is invoked with `Deno.Command` (never a shell), so there is no
  argv injection. Error messages carry pass-cli's stderr or its `Error:`
  lines only. Raw stdout (which for `item view` is the whole item, secret
  included) is never placed in an exception. Written data: none.

  **Secret keys appear in errors; remote text does not.** A failed lookup says
  which key failed — `Secret 'x/y' not found in vault 'z'` — and that is
  deliberate. The key is what YOU passed in; it is already in the model
  definition that asked for it, and an error that will not say which lookup
  failed makes a secrets provider undiagnosable. What is NOT forwarded is
  anything pass-cli or Proton said: stderr is reduced to a fixed verdict
  (`session-not-usable`, `item-not-found`, `network-failure`,
  `permission-denied`, `vault-not-found`, or `unclassified`), because that
  text can echo the arguments it was given and whatever the server returned.
  Exception strings from here reach swamp run logs and reports.

  **A key splits at the FIRST `/`.** `Example Service/API Key` means the item
  `Example Service`, field `API Key`. An item title containing `/` therefore
  cannot be addressed this way — use a `pass://SHARE_ID/ITEM_ID/FIELD` URI for
  those. The URI form is checked for liveness too.

  **Deleted means deleted.** Proton Pass moves an item to the trash rather than
  purging it, and `state` has always been in the item list. This provider now
  reads it: a trashed item is not listed and is not resolvable, so deleting a
  secret actually stops it being handed out. Previously it did not — the item
  stayed visible as an available key and `--item-title` would resolve to it.

  **A title must identify exactly one live item.** `put()` creates a NEW item
  on every call rather than updating in place, so real vaults accumulate items
  sharing a title. `pass-cli --item-title` silently picks one of them. A
  lookup that matches more than one active item is now refused by name, and a
  successful lookup is re-addressed by item ID so the value returned is the
  one that was chosen deliberately. Use a `pass://` URI to name a specific
  item when duplicates are intentional.

  **What this provider does not promise.** An item whose `state` field is
  absent is treated as live, because older pass-cli builds omit it and hiding
  every secret from them would be worse than the bug that reading `state`
  fixes. A `pass://` URI naming an item this vault does not list is passed
  through untouched, since it may address a different vault. And every call is
  a live lookup with a bounded timeout: nothing is cached, so a Proton outage
  is a failure rather than a stale success.
