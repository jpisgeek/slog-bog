manifestVersion: 1
name: "@jpisgeek/proton-pass"
version: 2026.09.05.1
description: >
  Proton Pass vault provider: resolves ${{ vault.get('<vault>', 'KEY') }} live through the official pass-cli at run time. Secrets stay in Proton Pass. This provider copies nothing into swamp storage or this repository and writes no files; pass-cli keeps its own local database. Read-only: accepts item titles and title/field. No writes, no pass:// URIs.
repository: https://github.com/jpisgeek/slog-bog/tree/main/proton-pass
paths:
  base: manifest
models: []
workflows: []
vaults:
  - proton_pass.ts
drivers: []
datastores: []
reports: []
additionalFiles:
  - README.md
  - LICENSE
platforms:
  - darwin-aarch64
  - linux-x86_64
labels:
  - proton
  - proton-pass
  - vault
  - secrets
dependencies: []
