package: "@jpisgeek/imagegen"
publicationNote: >-
  for security review requirements. Shared as GitHub source, not a Swamp registry release.
install: |
  Clone this repository and register the source in your Swamp repository:

  ```sh
  swamp extension source add /example/slog-bog/imagegen --only models
  ```

  See [Mac setup](MAC_SETUP.md) before running the behavior. An editable
  [workflow template](examples/imagegen.workflow.yaml) is included.
purpose: >-
  Generate local PNG graphics with FLUX.1-schnell through mflux and MLX on Apple
  Silicon. The default is 4-bit weights, four inference steps and 1024 × 1024.
  No frontier model, hosted inference service, or LM Studio is required.
example: |
  type: "@jpisgeek/imagegen"
  name: imagegen
  globalArguments:
    executable: /example/runtime/bin/mflux-generate
    modelPath: /example/models/schnell-q4
    outputRoot: /example/output
    timeoutSeconds: 600
caveats: |
  This is a reconstruction of a previously used local image-generation approach,
  not a recovered byte-for-byte copy. The historical dependency version and exact
  implementation were not available. No private prompts, artwork or provenance
  are included.

  The adapter targets the mflux 0.24.0 CLI. It passes a local checkpoint with
  `--base-model schnell --quantize 4`. Prepare all model and tokenizer assets
  before offline use. It sets Hugging Face offline and telemetry opt-out flags;
  missing assets must fail rather than download. These flags are not a network
  sandbox. Test with networking disconnected for an actual offline acceptance run.

  Optional `imagePath` uses ordinary image-to-image conditioning. It does not
  guarantee character identity or exact reference style. There is no negative
  prompt or guidance control because these are not useful schnell controls.

  Swamp merges known global fields into method arguments during dispatch.
  These fields are accepted for compatibility; execution uses the global
  configuration in the method context, not per-method path overrides.

  Each invocation creates a unique private output folder, a PNG, and a JSON
  provenance receipt. Success checks the exit code, file type, bounded file size,
  PNG signature and declared dimensions, then records a SHA-256. This is not a
  full PNG decode or a visual-quality check. Review the image before use.
  Outputs are not deleted by Swamp receipt garbage collection. Failed runs can
  leave partial files; inspect and remove those manually.

  Verification on Apple M5 with 32 GB memory: a real Swamp workflow generated
  and recorded a decoded, visually inspected 512 × 512 PNG; a direct adapter
  invocation also generated a 1024 × 1024 PNG. Both used four steps and offline
  environment flags with local weights. Networking was not disabled, so these
  runs do not establish network isolation. See MAC_SETUP.md for exact versions
  and the tested checkpoint. Unit tests also run on Linux.
security: |
  The configured executable, Python dependencies and checkpoint are trusted local
  inputs, not a sandbox. The process inherits the operator's permissions and
  environment; do not configure an untrusted executable. No shell is used, and
  arguments are validated. Paths must be absolute with no symlink components.
  Use canonical paths: on macOS `/tmp` and `/var` are symlink aliases, and
  some launcher paths are symlinks. Resolve them before configuring the adapter.
  Keep output/model directories private and do not mutate them during a run.
  Offline flags do not prevent a malicious executable from using the network.

  Prompts, seeds, hashes and output paths are stored as Swamp runtime data
  and in provenance.json, not logged. Use a local Swamp repository/datastore
  for offline execution. A shared or remote datastore can transmit receipts
  outside the Mac under that repository configuration. The prompt also appears
  in the process argument list, visible to local process inspection. Do not use
  secrets in prompts. Raw subprocess output is suppressed. Keep generated media,
  model instances, receipts, local paths and model weights out of public commits.
