package: "@jpisgeek/truenas"
types:
  - "@jpisgeek/truenas"
purpose: >-
  Read-only TrueNAS SCALE inventory and health over the JSON-RPC 2.0 WebSocket
  API: system identity, ZFS pools, physical disks, active alerts, and
  certificate expiry. Each is its own addressable resource, so a workflow
  can gate on any one of them. The NAS is the deep end of the swamp, and this
  is the depth gauge.
example: |
  globalArguments:
    # Prefer the DNS name the host's certificate was issued to; that is what
    # lets TLS verification succeed.
    baseUrl: https://truenas.example.com
    apiKey: ${{ vault.get('myvault', '<your-truenas-api-key-item>') }}
    # Pin the host the key may be sent to. Optional, but set it whenever
    # baseUrl is not a literal you can read right here.
    allowedHosts:
      - truenas.example.com
    timeoutSec: 20
    certWarnDays: 30
    allowInsecureHttp: false
caveats: >-
  Discovery only: there is no write path to TrueNAS anywhere in this model.
  Certificate expiry is computed independently of TrueNAS's own alert state.
  A `CertificateIsExpiring` alert dismissed in the UI is still reported, with
  `silenced: true`. Dismissing an alert does not renew a certificate, we
  checked.


  **Absent is not zero.** Five flags say whether a value is real before you
  gate on it: `expiryKnown` on a certificate (a CSR has no expiry),
  `capacityKnown` on a pool, `sizeKnown` and `poolKnown` on a disk, and
  `metricsKnown` on `system` for cores/memory/uptime. When one is false the
  numbers it covers are `-1`, never `0`, because `0` is a value TrueNAS
  legitimately reports for all of them and a capacity gate reading
  `usedPercent: 0` would call an unknown pool empty. `poolKnown` is the same
  idea for a string: a disk whose pool membership TrueNAS never answered is
  tagged `pool: unknown`, never `pool: none`, because when that join fails it
  fails for every disk at once and an orphaned-disk gate would fire across the
  whole array. `summary.poolsCapacityUnknown` surfaces the capacity case for a
  workflow that only reads the roll-up.


  **Malformed is not absent either.** A value that is present but cannot be
  read fails the whole run rather than being smoothed into a benign default:
  a fragmentation that is not a 0-100 percentage, a certificate expiry that is
  present but is not a date, a `pool.query` row missing `status`/`healthy`, an
  `alert.list` row missing `klass`/`level`/`formatted`, a `disk.query` row with
  no `identifier`/`devname`, an `alert.list` row with no `uuid`/`id`/`key`, or
  a `certificate.query` row with neither `until` nor `not_after`. An absent
  fragmentation is the one deliberate exception and still reads `0`: unlike
  capacity, 0% fragmentation is not itself an alarming value, so no gate is
  lulled by it.


  **All or nothing.** The five sub-fetches are issued together over one
  authenticated connection, and any failure or contract violation among them
  aborts the run before a single resource is written or pruned. There is no
  partial write.


  **An empty inventory is reported, not rolled up as healthy.** A run in which
  TrueNAS reports zero pools (or zero disks) sets `summary.discoveryDegraded`,
  plus `poolsReportedEmpty` / `disksReportedEmpty`, and logs a warning
  unconditionally, including on a first run where there is nothing stale to
  keep. Gate on `discoveryDegraded`, not on the counts: `pools: 0,
  poolsUnhealthy: 0` is also what a flawless box looks like. Those records are
  not pruned either, because an empty pool list is what a pool still importing
  after a reboot looks like; records for an object that really was removed are
  pruned by the next run that reports any object of that kind, so only the
  removal of the very last pool or disk leaves a stale record to clear by
  hand. Alerts and certificates are pruned on absence as before, since a
  resolved alert must go.


  **Instance names.** `system` and `summary` are fixed names. Everything else
  is `<prefix>-<slug of the identity fields, up to 48 chars>-<32 hex digits of
  SHA-256 over the length-prefixed raw identity>`, with prefixes `pool-`,
  `disk-`, `alert-` and `cert-`. Certificates use `cert-` even though the
  resource kind is `certificate`: the name is the record's identity in the
  datastore, so renaming the prefix would prune and recreate every stored
  certificate and lose its history, which is not worth a tidier spelling.
  This release widened that digest from 32 bits of FNV-1a to 128 bits of
  SHA-256 and changed how the identity is encoded, so **every instance name
  changes once when you upgrade to it**: the first run after upgrading writes
  records under the new names and prunes the old ones, and history under the
  old names is lost. That is a deliberate one-time cost. 32 bits is a coin flip across
  ~77,000 identities, and a collision there means two disks silently sharing
  one infinite-lifetime record.


  `baseUrl` may carry a host, port and path (a reverse-proxied subpath works)
  but not a query string, a fragment, or userinfo; the `wss://` URL is rebuilt
  from its parts. Verified against SCALE 25.10.
  `auth.login_with_api_key` is scheduled for removal in TrueNAS 27: a
  successful connect to a host that new logs a warning, and a failed
  authentication says so in the error, which is where you actually hit it if
  the call is gone. If a scheduled run fails to connect while the same call
  works from a shell on the same Mac, suspect macOS Local Network privacy.
security: >-
  **The API key.** Marked sensitive, sent once over the authenticated
  WebSocket, and never logged. It is also stripped defensively from any text
  the far end sends back, because `auth.login_with_api_key` takes the key as
  its only argument and nothing in the protocol stops a host from echoing it
  in an error message.


  **Where the key may go.** `baseUrl` must be `https://` (which becomes
  `wss://`), must not embed userinfo, and must not carry a query string or
  fragment. `allowedHosts` pins the exact host the key may be sent to; when
  set it is enforced before any socket opens, and a pin that is not a bare
  host or `host:port` is rejected as a configuration error rather than
  silently matching nothing. **It is optional, and that is a deliberate
  trade.** Where `baseUrl` is a literal in your workflow file, a mandatory
  allowlist is a second copy of that same literal written at the same moment,
  so it cannot catch the typo it exists to catch. Where `baseUrl` comes from a
  vault expression, a datastore value, or a workflow variable, the pin is an
  independent literal and the only thing standing between a changed upstream
  value and your API key going somewhere new. Set it in that case. Left unset,
  the key goes to whatever host `baseUrl` names.


  **Cleartext opt-out.** `allowInsecureHttp: true` permits `http://` ->
  `ws://` with the key in cleartext on every call, so anyone on the path
  captures a live TrueNAS API key and any host answering that address receives
  it. It is off by default and exists for a trusted loopback or VPN path where
  TLS genuinely cannot be terminated on the NAS; leave it off unless that
  describes you.


  **Remote text.** Everything the far end says crosses one boundary on its way
  into a log line, an error message, a stored field or a tag: the API key is
  redacted out of it, control, bidi and zero-width characters are removed so
  it cannot drive a terminal or reorder what you read, and it is truncated
  (200 characters for logs and errors, 4 KB for stored alert text). It is
  truncated rather than blanked, because "TrueNAS RPC error 11: pool is busy"
  is the finding and a canned status code would make this model undiagnosable
  for the cases it exists to diagnose. The residual trade: a bounded, screened
  fragment of whatever the box said still reaches your logs and your `alert`
  records.


  **Written data.** Hostname, version, pool names and health, disk models and
  serial numbers, certificate names and CNs (which commonly reveal internal
  DNS names), and full alert text. Alert text is free-form prose written by
  TrueNAS and routinely embeds IP addresses, usernames from failed-login
  alerts, share and dataset paths, and disk serial numbers. It is kept in full
  rather than redacted, because an alert you cannot read is an alert you
  cannot act on. Anywhere these resources are read is somewhere that data
  goes.
