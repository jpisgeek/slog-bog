package: "@jpisgeek/dashboard-compose"
purpose: >-
  Optional Swamp workflows that render explicit dashboard bundle v1 reports.
  Choose homelab-only, Swamp-only, hosted-AI-only, local-inference-only, or a
  mixed workflow. The package contains no collectors and does not discover
  models by alias or inspect Swamp's private storage.
example: |
  # Install only the renderer, this workflow package, and the producers you use.
  # Run producers first so their scoped normalization reports exist.
  swamp workflow validate @jpisgeek/dashboard-local-inference-only --json
  swamp workflow run @jpisgeek/dashboard-local-inference-only \
    --input lmstudioModel=lmstudio-daemon

  # The mixed workflow defaults every domain off. Enable only selected domains.
  swamp workflow validate @jpisgeek/dashboard-mixed --json
  swamp workflow run @jpisgeek/dashboard-mixed \
    --input includeLocalInference=true \
    --input localInferenceModel=lmstudio-daemon
caveats: >-
  These workflows compose already-normalized report data; they do not schedule
  collector runs. Run the selected collector method first and require its
  dashboard normalization report on that model definition. Input model names
  are explicit and feed data.latest through CEL. A selected source with no
  current report fails instead of silently becoming zero. The mixed workflow
  represents one bundle per broad domain; use the dedicated domain workflows
  when combining several providers or appliances within that domain.
security: >-
  No credentials, endpoints, hostnames, or private inventories are included.
  Workflows invoke only @jpisgeek/dashboard and pass selected stored report
  attributes through CEL. Rendered operational data can still be sensitive;
  protect the output according to the sensitivity carried by its bundles.
