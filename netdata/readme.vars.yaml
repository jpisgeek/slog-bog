# Hand-written inputs for scripts/gen-readme.ts. Everything else in README.md
# comes from the code. Placeholders only, never a real host, path, or vault item.
package: "@jpisgeek/netdata"
types:
  - "@jpisgeek/netdata"
purpose: >-
  State truth across a set of standalone Netdata agents: which nodes answer,
  what they are, which alarms are firing, and how much filesystem headroom is
  left. Deliberately not a metrics collector. Netdata already stores the
  telemetry and runs the health engine. This model just wades in, records the
  verdicts, and hands them to whatever workflow needs to act on them.
example: |
  globalArguments:
    nodes:
      - name: nas
        url: http://nas.example.com:19999
      - name: laptop
        # Agent bound to loopback with the host firewall closed: swamp runs
        # curl on the box over SSH instead of connecting to the URL directly.
        url: http://127.0.0.1:19999
        ssh:
          host: laptop.example.com
          user: netdata-reader
          port: 22
    timeoutSec: 15
    diskWarnPercent: 85
    maxConcurrency: 8
    maxMountsPerNode: 256
    maxAlarmsPerNode: 512
    nodeBudgetSec: 300
caveats: >-
  An unreachable node is data, not an error. It is written with
  `reachable: false` and the sweep continues. Something in the swamp is always
  powered off. A node that answers only partially (alarms or chart data timed
  out) keeps its last known detail instead of being zeroed. That includes a
  single mount whose data query failed: its record and its place in
  `mountsOverThreshold` both carry forward, and the node counts toward
  `summary.nodesDegraded`. Whenever `nodesDegraded` is above zero, read the
  alarm and mount roll-ups as a floor rather than a current total. An alarm
  Netdata could not calculate a value for is stored with `value: null`, which
  means unknown -- it is deliberately not 0, which would be
  indistinguishable from a real reading of zero. Pruning of departed records
  happens only on a full sweep. A single-node run (`--input node=<name>`)
  never deletes anything. Instance names for alarms and mounts carry a hash
  suffix, so look them up with `swamp data list <model>` rather than
  constructing them. Node names must stay distinct after normalisation, not
  just as typed: the node record's instance name is `node-<slug>`, so `NAS`
  and `nas`, or `db 1` and `db-1`, name the same record and are rejected at
  the start of the sweep rather than silently overwriting each other. A
  response that is not the shape the endpoint promises -- an `alarms` or
  `charts` value that is not an object, a `/data` row that is not an array --
  is treated as a failed sub-fetch and carried forward, not read as zero
  alarms or an empty filesystem.
security: >-
  Plain HTTP to the agent API is accepted because the API carries no
  credential. HTTP is still unauthenticated in both directions: an on-path
  party can read the hostnames, OS/version, alarm text and mount paths in
  transit, and can rewrite the responses too (return no alarms so a firing
  critical reads as cleared, or inject text into the stored `error`/`info`
  fields). Prefer the SSH transport, or HTTPS for anything off a trusted LAN.
  `url` is restricted to `http(s)` and rejected if it embeds userinfo, and it
  is persisted verbatim as non-sensitive data. Redirects are never followed,
  on either transport: a 3xx is refused and recorded as a failed poll. A
  configured `https://` URL therefore stays HTTPS -- previously the agent
  could answer 302 with an `http://` Location and silently downgrade the
  connection to cleartext, defeating the operator's choice without saying so
  anywhere. The SSH transport uses `BatchMode=yes` (unknown host keys fail
  closed) and never assembles a local shell command. Because that rewrite is
  in the threat model, the volume a single agent can impose is bounded as well
  as its content: response bodies are refused above 8 MiB, `maxMountsPerNode`
  and `maxAlarmsPerNode` cap how many per-mount queries and alarm writes one
  node can drive, and `nodeBudgetSec` caps the wall-clock time its whole poll
  may take. Hitting any of those marks the node degraded and preserves its
  existing records rather than pruning them. Every individual string the agent
  supplies -- alarm name, chart, status, units, the free-text `info`, mount
  path, hostname, OS and version -- is capped at 512 characters and has
  control characters replaced before it is stored or hashed into a record
  name, so no single field can be arbitrarily large and none can carry a raw
  escape sequence into a terminal or forge a colliding record name. Written
  data: node URL, hostname, OS, Netdata version, alarm names/values, mount
  paths and capacity, plus a free-text `error` field on unreachable nodes (a
  classified failure message, `user@host` and stderr stay in the log, not the
  resource).
