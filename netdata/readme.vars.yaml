# Hand-written inputs for scripts/gen-readme.ts. Everything else in README.md
# comes from the code. Placeholders only, never a real host, path, or vault item.
package: "@jpisgeek/netdata"
types:
  - "@jpisgeek/netdata"
purpose: >-
  State truth across a set of standalone Netdata agents: which nodes answer,
  what they are, which alarms are firing, and how much filesystem headroom is
  left. Deliberately not a metrics collector. Netdata already stores the
  telemetry and runs the health engine. This model just wades in, records the
  verdicts, and hands them to whatever workflow needs to act on them.
example: |
  globalArguments:
    nodes:
      - name: nas
        url: http://nas.example.com:19999
      - name: laptop
        # Agent bound to loopback with the host firewall closed: swamp runs
        # curl on the box over SSH instead of connecting to the URL directly.
        url: http://127.0.0.1:19999
        ssh:
          host: laptop.example.com
          user: netdata-reader
          port: 22
    timeoutSec: 15
    diskWarnPercent: 85
    maxConcurrency: 8
    maxMountsPerNode: 256
    maxAlarmsPerNode: 512
    nodeBudgetSec: 300
caveats: >-
  An unreachable node is data, not an error. It is written with
  `reachable: false` and the sweep continues. Something in the swamp is always
  powered off. A node that answers only partially (alarms or chart data timed
  out) keeps its last known detail instead of being zeroed. That includes a
  single mount whose data query failed: its record and its place in
  `mountsOverThreshold` both carry forward, and the node counts toward
  `summary.nodesDegraded`. Whenever `nodesDegraded` is above zero, read the
  alarm and mount roll-ups as a floor rather than a current total. An alarm
  Netdata could not calculate a value for is stored with `value: null`, which
  means unknown -- it is deliberately not 0, which would be
  indistinguishable from a real reading of zero. Pruning of departed records
  happens only on a full sweep. A single-node run (`--input node=<name>`)
  never deletes anything. Instance names for alarms and mounts carry a hash
  suffix, so look them up with `swamp data list <model>` rather than
  constructing them. Node names must stay distinct after normalisation, not
  just as typed: the node record's instance name is `node-<slug>`, so `NAS`
  and `nas`, or `db 1` and `db-1`, name the same record and are rejected at
  the start of the sweep rather than silently overwriting each other. A
  response that is not the shape the endpoint promises -- a whole response
  body that is not a JSON object, an `alarms` or `charts` value that is not an
  object, a `/data` row that is not an array -- is treated as a failed
  sub-fetch and carried forward, not read as zero alarms or an empty
  filesystem. Two records that would generate the same instance name are not
  merged: the first is written, the second is refused with a warning, and the
  node is marked degraded so the shortfall is visible rather than silent.
  This release renames every `alarm-*` and `mount-*` record once: the identity
  behind a record's hash suffix is now length-prefixed rather than joined on a
  control character, and the hash itself is wider. The first full sweep after
  the upgrade writes the new names and prunes the old ones. Node and summary
  record names are unchanged, and no stored field changes meaning.
security: |
  **Transport.** Plain HTTP to the agent API is accepted because the API
  carries no credential. This is a deliberate trade, and what you are
  accepting is concrete: HTTP is unauthenticated in both directions, so an
  on-path party can read the hostnames, OS/version, alarm text and mount paths
  in transit, and can rewrite the responses too -- return no alarms so a
  firing critical reads as cleared, or inject text into the stored
  `error`/`info` fields. Prefer the SSH transport, or HTTPS for anything off a
  trusted LAN. `url` must be `http(s)` with no embedded userinfo, no query
  string and no fragment; a query string both carries credentials in practice
  and, because every endpoint is appended to this value, would redirect all
  four API calls onto `/`. The value stored on the `node` record is the
  canonical form swamp actually polled -- scheme, host, port and path with
  trailing slashes removed -- not the string as typed. Redirects are never
  followed, on either transport: a 3xx is refused and recorded as a failed
  poll, so a configured `https://` URL stays HTTPS instead of being downgraded
  to cleartext by the server's own `Location`.

  **SSH transport.** `ssh` runs with `BatchMode=yes` and an explicit
  `StrictHostKeyChecking=yes`, both passed on the command line so they win
  over `~/.ssh/config` and `/etc/ssh/ssh_config`. That means the node's host
  key must already be in the swamp host's `known_hosts`: an unknown or changed
  key fails the poll rather than being accepted. `ssh.host` and `ssh.user` are
  bounded to hostname/username characters, and no local shell is ever
  assembled. The remote `curl` runs with `-q` first, so `/etc/curlrc` and
  `~/.curlrc` on the node cannot switch on `insecure`, `location`, a `proxy`
  or a `user` credential behind swamp's back, and it then states its own
  policy explicitly (`--proto '=http,https'`, `--noproxy '*'`, no `-L`).

  **Bounds.** Because response rewriting is in the threat model, the volume a
  single agent can impose is bounded as well as its content: response bodies
  are refused above 8 MiB, `maxMountsPerNode` and `maxAlarmsPerNode` cap how
  many per-mount queries and alarm writes one node can drive, and
  `nodeBudgetSec` caps the wall-clock time its whole poll may take. Hitting
  any of those marks the node degraded and preserves its existing records
  rather than pruning them.

  **Stored data.** Written: node URL, hostname, OS, Netdata version, alarm
  names/values/units/info, mount paths and capacity, and an `error` field on
  nodes that did not answer. Treat all of it with the sensitivity of your
  infrastructure inventory. The free-text fields an agent supplies -- alarm
  name, chart, status, units, `info`, mount path, hostname, OS and version --
  are deliberately persisted rather than dropped, because they are the reason
  the records are useful; the trade is that on a cleartext poll their contents
  are chosen by whoever can answer or rewrite the response. They are bounded
  rather than filtered: each is capped at 512 characters and has control
  characters replaced before it is stored, hashed into a record name, or
  written to a log field, so no single field can be arbitrarily large and none
  can carry a raw escape sequence into a terminal or forge a colliding record
  name. No other
  redaction is applied, so do not treat these fields as trustworthy prose. The
  `error` field is the exception: it is not agent text at all but one value
  from a fixed set of failure classes (`connection failed`, `timed out`,
  `HTTP 503 (transient)`, `ssh transport: host key verification failed`,
  `malformed response …`, and so on). Nothing from a response body, a
  `Location` header, ssh stderr or an ssh `user@host` reaches a stored field.

  **Logs.** The full diagnostic does go to `logger.warning`: the ssh target,
  ssh stderr, a bounded prefix of an HTTP error body, a refused redirect's
  `Location`, and the agent-supplied names in a degraded-mount warning. That
  is a deliberate trade in the other direction -- a fleet that quietly stops
  answering has to be diagnosable without querying stored data -- and it means
  swamp's log sink inherits the same sensitivity as the inventory: private
  hostnames, key paths echoed by ssh, and remote-chosen text. What the trade
  does not include is size: the agent-supplied parts of a log line -- alarm
  name, chart id, mount path, the endpoint path of a failed per-mount query --
  go through the same 512-character cap and control-character replacement as
  the stored fields, so a rewritten response cannot turn one warning into a
  multi-megabyte log entry. If your logs go somewhere the datastore does not,
  account for that.
