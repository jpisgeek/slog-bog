publicationNote: >-
  for the repository's security review requirements. This version is shared as
  GitHub source and is not published to the Swamp registry.
install: |
  Clone this GitHub repository and register this extension's source in your Swamp repo.
  Replace the example path with the canonical location of your clone:

  ```sh
  swamp extension source add /example/slog-bog/lmstudio --only models
  ```

  This repaired version is distributed through GitHub source, not a registry release.
package: "@jpisgeek/lmstudio"
types:
  - "@jpisgeek/lmstudio/endpoint"
  - "@jpisgeek/lmstudio/probe"
  - "@jpisgeek/lmstudio/daemon"
purpose: >-
  Probe and validate an OpenAI-compatible inference endpoint (LM Studio, vLLM,
  llama.cpp server, a gateway in front of one) before you trust it in a
  workflow. `endpoint` answers "what is loaded, and is it reachable / did the
  token work"; `probe` measures the real embedding dimension, runs a chat
  completion with reasoning-budget and context-exhaustion diagnostics, and a
  short capability battery.
example: |
  # swamp model create @jpisgeek/lmstudio/endpoint my-inference \
  #   --global-arg baseUrl=https://inference.example.com/v1 \
  #   --global-arg 'apiToken=${{ vault.get("myvault", "Example Inference/API Key") }}' \
  #   --global-arg timeoutSec=30 --json
  globalArguments:
    baseUrl: https://inference.example.com/v1
    apiToken: ${{ vault.get('myvault', 'Example Inference/API Key') }}
    timeoutSec: 30
  # @jpisgeek/lmstudio/probe takes the same three arguments; create it under
  # its own model name and run:
  #   swamp model method run my-probe embedding --input model=<model-id>
  #   swamp model method run my-probe completion --input model=<model-id> --input 'prompt=Say hello in one word.'
  #   swamp model method run my-probe capabilities --input model=<model-id>
  # On the host running llmster (for example, a headless Mac Studio):
  # swamp model create @jpisgeek/lmstudio/daemon my-daemon --json
  # swamp model method run my-daemon observe
caveats: >-
  No default endpoint, `baseUrl` is required -- and it is accepted for any
  http(s) host. That is deliberate: the extension is generic and has no
  vendor domain to pin to, so nothing here restricts where it connects. A
  typo or a hostile model config sends the bearer token and your prompts to
  whatever host is named, and can reach services on your own network. Treat
  `baseUrl` as a credential destination and set it explicitly per deployment.


  What throws versus what is written as data is deliberate and differs per
  method: `endpoint.models` throws on every failure (UNAUTHORIZED,
  UNREACHABLE, TIMEOUT, HTTP_ERROR, MALFORMED_RESPONSE, CANCELLED), and a 2xx
  body that is not an OpenAI envelope is one of the MALFORMED_RESPONSE cases
  rather than an untagged error; `endpoint.health` writes every endpoint-side
  outcome; the three `probe` methods record everything with an `errorKind`.
  All of them throw on caller cancellation rather than writing it, including a
  cancellation that lands after the response headers have already arrived.


  On `health`, `authorized` and `httpStatus` are nullable, and null means "not
  determined" rather than "no". `authorized` is true only after a 2xx, false
  only for an explicit 401/403, and null for everything else -- a 500, a
  timeout, a refused connection. `httpStatus` is null when no HTTP response
  arrived at all; it is never 0. Consumers that read `authorized == false` as
  "this token is bad" and `httpStatus == 0` as a status code need updating:
  earlier versions of this extension wrote exactly that for outcomes in which
  the token was never actually judged.


  `contextExhausted` is a heuristic (finish_reason "length" under the
  requested cap) and remains unknown when the endpoint omits valid token
  usage. `honorsResponseFormat` means the model returned a JSON object, not
  that it returned the exact object asked for.


  All three probe methods retry a 429/503 once, Retry-After-aware and capped.
  On the embedding probe a rate limit or a 5xx that survives the retry is
  recorded as `rate_limited` / `server_error`, never as
  `no_embedding_capability` -- the endpoint declined to answer the capability
  question rather than answering no. Every other non-2xx, including 408, 409,
  413, and 422, IS labelled `no_embedding_capability`, on the assumption that
  an endpoint which understood the request and refused it has no embedding
  model loaded. That assumption is wrong for a malformed or oversized input,
  so read `httpStatus` alongside the label rather than trusting the label on
  its own.


  Probe instance names are `<method>-<slug-of-model-id>-<128-bit hash>`, so
  look them up after a run. The hash widened and the slug became bounded in
  this version, so probe results written by an earlier version keep their old
  instance names instead of being overwritten -- compare `checkedAt` if you
  find two for one model.


  The daemon model runs `lms ps --json` beside llmster. Set its optional
  `host` argument only when deliberately using LM Studio's supported remote
  CLI mode, and note that it accepts loopback addresses only (`localhost`,
  `127.0.0.0/8`, `::1`, with or without a port): `lms --host` speaks cleartext
  and offers no TLS, so a remote daemon is reached by pointing `host` at the
  local end of a tunnel you terminate yourself -- WireGuard, `ssh -L`,
  stunnel. A directly named remote host is refused when the model is
  configured, not silently sent in the clear. `lmsBinary` names whatever
  executable you point it at, and the model runs it with its own process
  permissions; leave it at `lms` unless you have a specific reason not to.
security: >-
  The bearer token is marked sensitive, must come from a vault expression
  (never an environment variable, env values persist into `.swamp/data/`),
  is redacted from every response body before it can reach an error, and URLs
  in logs and errors have userinfo, query strings, and fragments stripped.
  Configured base URLs containing any of them are rejected. `http://` is
  accepted for endpoints behind an already-encrypted tunnel, with the caveat
  that the token then travels in cleartext on that hop, and any http(s)
  hostname is accepted at all -- see the Caveats above for what that means.


  Every HTTP response body is read under a byte cap rather than buffered
  whole, so a hostile endpoint cannot stream an unbounded reply inside the
  request deadline; an oversized body is refused, never parsed from its
  prefix. Every scrap of endpoint-supplied text that reaches a stored `error`
  or a thrown message is screened for control, bidi, zero-width, and surrogate
  characters, then token-redacted, then length-bounded -- in that order, over
  the whole response -- so a proxy error page cannot drive the terminal of
  whoever reads that data later. The order is not cosmetic: screening first
  means a token echoed back with a zero-width character wedged into it is
  still recognised and removed, and bounding last means no cut can split the
  token into a prefix that the redaction pass no longer matches.


  The endpoint's own words are kept rather than replaced with a canned status
  line, because they are what makes a failure diagnosable -- "no embedding
  model is currently loaded" is the whole point of the
  `no_embedding_capability` finding. One consequence, stated plainly: this
  extension never writes your prompt to a resource, but an endpoint that
  echoes your request back inside its own error body can put a screened,
  bounded fragment of it in the `error` field. If your prompts are sensitive
  and your endpoint is not trusted, do not run the completion probe against
  it. The embedding probe does not carry that exposure: `input` is stripped
  from the endpoint's error text the same way the bearer token is, in the same
  position -- after screening, before bounding -- so an echoed embedding input
  reaches the stored `error` as `[REDACTED]`. Both `input` and `prompt` are
  marked sensitive arguments.


  Model ids are treated as remote text on both sides: bounded to 256
  characters and screened for control, bidi, and zero-width characters,
  whether they arrive from `/v1/models` or from a caller's argument, because
  they are stored, tagged, logged, and folded into an instance name that maps
  to a storage path. An oversized model list, or an id that fails the screen,
  is refused as `MALFORMED_RESPONSE` rather than stored. A model id that
  contains the configured API token is refused too, in both directions -- an
  endpoint answering `/v1/models` with your bearer token as a model id, and a
  caller passing it as a probe's `model` argument -- because a model id is
  stored as a measurement and never goes through redaction.


  Written data: served model ids, latencies, optional token counts, boolean
  findings, and short screened endpoint error text. Daemon observations retain
  loaded model identifiers, type, and architecture -- null when the daemon did
  not report them, never an empty string that would read as measured -- but
  discard model paths and raw command error output. `lms` output is read under
  a per-stream byte cap rather than buffered to completion, its identifiers are
  length-bounded and screened for control, bidi, and zero-width characters, and
  an unscreenable, oversized, or cap-overflowing payload is refused as
  `invalid-response` instead of being stored or misread as an unreachable host.
  The `timeoutMs` argument is a hard bound: the CLI is sent SIGTERM, escalated
  to SIGKILL, and abandoned outright if it still has not released its pipes.
  The CLI is spawned with a cleared environment: it inherits nothing but
  `PATH` (to resolve the binary and its runtime) and `HOME` (for
  `~/.lmstudio`), so no other value the runtime happens to hold reaches the
  executable named by `lmsBinary`.
