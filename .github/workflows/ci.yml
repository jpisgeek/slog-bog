name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # gitleaks scans history, not just the tip

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: gitleaks (credential patterns, full history)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: scanner self-test
        run: scripts/test-scan.sh

      - name: identifier scan (generic rules; the private denylist runs locally only)
        # review/ is excluded on purpose: the prompt names the patterns it hunts.
        run: |
          dirs=$(for d in */; do [ -f "$d/manifest.yaml" ] && printf '%s ' "$d"; done)
          scripts/scan-identifiers.sh $dirs templates/ README.md CONTRIBUTING.md SECURITY.md

      - name: deno fmt
        run: |
          dirs=$(for d in */; do [ -f "$d/manifest.yaml" ] && printf '%s ' "$d"; done)
          deno fmt --check $dirs scripts/

      - name: deno tests
        run: |
          if ls */*_test.ts >/dev/null 2>&1; then
            deno test --allow-read --allow-env --allow-net $(ls -d */*_test.ts | xargs -n1 dirname | sort -u)
          else
            echo "no tests yet"
          fi

      - name: READMEs are generated and current (zod schemas read from source — no swamp needed)
        run: deno run --allow-read --allow-write --allow-run --allow-env scripts/gen-readme.ts --check

      - name: review verdicts match content hashes
        run: scripts/check-review-verdicts.sh

      # swamp itself is not installed in CI: the registry-side gates
      # (extension fmt / quality / push --dry-run) run locally via
      # scripts/publish.sh, where the swamp toolchain and registry auth live.
