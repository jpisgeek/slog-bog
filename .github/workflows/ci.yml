name: ci

on:
  push:
    branches: [main, extension-publication-20261014]
  pull_request:

permissions:
  contents: read

jobs:
  gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # gitleaks scans history, not just the tip

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: gitleaks (credential patterns, full history)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: scanner self-test
        run: scripts/test-scan.sh

      - name: identifier scan (generic rules; the private denylist runs locally only)
        # review/ is excluded on purpose: the prompt names the patterns it hunts.
        run: |
          dirs=$(for d in */; do [ -f "$d/manifest.yaml" ] && printf '%s ' "$d"; done)
          scripts/scan-identifiers.sh $dirs templates/ README.md CONTRIBUTING.md SECURITY.md

      - name: deno fmt
        run: |
          dirs=$(for d in */; do [ -f "$d/manifest.yaml" ] && printf '%s ' "$d"; done)
          deno fmt --check $dirs scripts/

      - name: deno tests
        run: |
          # --allow-run: the vault tests drive a fake pass-cli.
          # --allow-write: the dashboard tests render to a temp file.
          # No test reaches the network — fetch is stubbed — but --allow-net
          # keeps a stub miss surfacing as a test failure, not a permission one.
          deno test --allow-read --allow-write --allow-env --allow-net --allow-run \
            $(ls -d */*_test.ts | xargs -n1 dirname | sort -u)

      - name: real disposable Caddy and systemd integration
        run: |
          # An empty GitHub-hosted VM only; the script refuses preexisting
          # Caddy resources. It never targets the publisher's live proxy.
          mkdir "$RUNNER_TEMP/caddy-binary"
          curl --fail --location --silent --show-error \
            https://github.com/caddyserver/caddy/releases/download/v2.11.7/caddy_2.11.7_linux_amd64.tar.gz \
            -o "$RUNNER_TEMP/caddy-binary/caddy.tar.gz"
          echo "727b91701a392de6ebc5027509f548bf39979e5216340d0faed8fa5e69c84f8b  $RUNNER_TEMP/caddy-binary/caddy.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/caddy-binary/caddy.tar.gz" -C "$RUNNER_TEMP/caddy-binary" caddy
          sudo env GITHUB_ACTIONS=true RUNNER_ENVIRONMENT="$RUNNER_ENVIRONMENT" \
            python3 scripts/test-caddy-systemd.py --disposable-hosted-runner "$RUNNER_TEMP/caddy-binary/caddy"

      - name: fixed evidence schema compatibility
        run: |
          # Swamp externalizes Zod; a fresh scorer and an installed consumer
          # need not use the same minor. Neither may silently discard raw keys.
          printf '{"imports":{"npm:zod@4":"npm:zod@4.4.3"}}\n' > "$RUNNER_TEMP/zod-installed.json"
          deno test --import-map "$RUNNER_TEMP/zod-installed.json" documentation-evidence/ inventory-coverage/
          deno test --unsafe-proto documentation-evidence/ inventory-coverage/

      - name: release evidence boundary regressions
        run: |
          # The synthetic repos intentionally execute the helper cached-only.
          # A fresh runner needs its pinned tooling dependencies prepared first.
          deno cache scripts/content-hash.ts
          python3 -m unittest discover -s tests -p committed_reviews_test.py

      - name: every extension has tests
        run: |
          missing=""
          for d in */; do
            [ -f "$d/manifest.yaml" ] || continue
            ls "$d"*_test.ts >/dev/null 2>&1 || missing="$missing $d"
          done
          if [ -n "$missing" ]; then
            echo "extensions without tests:$missing" >&2
            exit 1
          fi
          echo "all extensions have tests"

      - name: READMEs are generated and current (zod schemas read from source — no swamp needed)
        run: deno run --allow-read --allow-write --allow-run --allow-env scripts/gen-readme.ts --check

      - name: review verdicts match content hashes
        run: |
          if [ "$GITHUB_REF_NAME" = extension-publication-20261014 ]; then
            # This isolated branch releases only the explicitly reviewed set.
            scripts/check-review-verdicts.sh mise/manifest.yaml video-pipeline/manifest.yaml subscription-metadata/manifest.yaml documentation-evidence/manifest.yaml inventory-coverage/manifest.yaml caddy/manifest.yaml
          else
            scripts/check-review-verdicts.sh
          fi

      # swamp itself is not installed in CI: the registry-side gates
      # (extension fmt / quality / push --dry-run) run locally via
      # scripts/publish.sh, where the swamp toolchain and registry auth live.
