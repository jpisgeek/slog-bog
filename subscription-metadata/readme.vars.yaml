install: |
  ```sh
  swamp extension pull @jpisgeek/subscription-metadata
  ```
package: "@jpisgeek/subscription-metadata"
purpose: >-
  Persists explicit operator-supplied plan name, billing cadence, recurring
  price, currency, renewal window, seats, and provider-declared limits. It
  keeps subscription facts separate from API metering and never derives
  remaining quota or per-token cost.
example: |
  globalArguments:
    provider: Example AI
    planName: Team
    billingCadence: monthly
    priceMinor: "2500"
    currency: USD
    seats: 4
    declaredLimits:
      - name: Included requests
        value: 1000
        unit: requests
        period: month
  reports:
    require:
      - '@jpisgeek/subscription-metadata'
caveats: >-
  Every value remains an unverified operator declaration, even with a
  sourceReference. References are public vendor-page provenance only: the
  extension never fetches them or verifies billing facts. Missing optional plan
  facts remain absent; declaredLimits defaults to an empty list. Each capture
  writes the snapshot instance named subscription-metadata. Provider/plan labels
  must include a visible Unicode letter or digit, have at
  most 120 UTF-16 units, and contain no control/format characters, line/paragraph
  separators, unpaired surrogates, private-use/unassigned code points or
  default-ignorable characters. Other visible punctuation/symbols are allowed.
  Report freshness is always `unknown`: capturedAt records when a declaration
  was stored, not when billing facts were verified. No maximum-age policy is
  asserted. A valid informational section means the declaration passed validation,
  not that the subscription is currently healthy; overall state remains unknown.
  priceMinor is the recurring plan price in currency minor units and never API
  usage cost. Declared limits support a closed capacity vocabulary, not arbitrary
  provider wording: `Included requests` with `requests`, `Context window` with
  `tokens`, `Throughput` with `tokens-per-second`, and `Seats included` with
  `count`. Capacity values and seats must be nonnegative safe integers; fractional
  throughput is not supported. At most 50 limits are accepted. Names and their
  metric identities are case-insensitive but otherwise exact. Optional periods are
  exactly `minute`, `hour`, `day`, `week`, `month`, `year`, or `billing cycle`.
  Other names, mismatched units, extra wording, invisible characters and
  homoglyphs are rejected, so balance/quota-price synonyms cannot bypass a word
  blacklist. This validates the declared category, not the truth of the number;
  operators must supply truthful capacities rather than relabel balances or prices.
  Earlier source-only versions accepted arbitrary limit labels; unsupported
  legacy snapshots now render as unknown rather than healthy metrics.
  Declared limits must be distinct
  in name, unit, and period: the dashboard metric id is derived from that
  identity rather than from array position, so it stays attached to the same
  limit when the list is reordered, and two limits that share an identity are
  rejected. Currency uses three uppercase letters; price and currency must be
  supplied together; priceMinor carries at most fifteen integer digits and four
  decimals and is rejected unless the exact value survives the report's
  numeric conversion, so a published price is always the declared one; renewal
  timestamps use ISO datetime values. This package performs no
  account-dashboard scraping.
security: >-
  This package performs no network, process, environment, or vault operations.
  Provider, plan, price, currency, renewal window, seats, declared limits, and
  the source reference are commercially sensitive, so the dashboard bundle, its
  section, and every fact, metric, and reference carrying one of them are
  classified `sensitive` rather than `operational`, and the bundle enumerates
  each of those fields; a publication-aware renderer should treat the whole
  section as unpublishable. The raw Swamp model id and name are withheld; the
  required producer modelName is a constant display label. The stable bundle id
  is a hash of the Swamp model id: it permits correlation across captures and
  is not an anonymity guarantee. Limit metric ids encode the supported capacity
  category/unit/period, never commercial values or free-form labels.
  Protect stored Swamp data and rendered dashboards
  accordingly. A source reference cannot carry a credential in any part of the
  URL: besides requiring HTTPS and rejecting credentials, query parameters, and
  fragments, it must be one of the public vendor origins listed in the source
  (`https://www.anthropic.com`, `https://openai.com`, `https://proton.me`,
  `https://github.com`) with one of the paths `/`, `/pricing`, or `/plans`, and
  the exact literal spelling must match; whitespace, controls and normalized
  aliases are rejected rather than stored. These finite public URLs are not
  credentials: supply them literally, not via a vault expression. They are stored
  in configuration and snapshots without Swamp's secret-field vaulting, which
  would otherwise replace URLs with expressions unreadable by the report.
  Protect the containing commercial metadata even though the URL is public.
  Resource tags carry only
  the constant `provenance` marker; no subscription value is tagged. The
  rendered Markdown carries no subscription value at all, because it cannot
  carry the sensitivity classification the JSON bundle does.
