# Hand-written inputs for scripts/gen-readme.ts. Everything else in README.md
# comes from the code. Placeholders only, never a real host, path, or vault item.
package: "@jpisgeek/mise"
purpose: >-
  Toolchain state across a fleet, as measured rather than as assumed. Records
  which tool versions each host is actually running and where that parts ways
  with the host's own config: asked for but never installed, installed but not
  active, declared in a config that never took, or simply behind. Installs
  nothing and upgrades nothing. mise already does that job. This one wades
  through the fleet, writes down what it finds, and leaves the acting to
  whatever workflow wants it.
example: |
  globalArguments:
    nodes:
      - name: workstation
        dir: /srv/project
      - name: builder
        dir: /srv/project
        ssh:
          host: builder.example.com
          user: toolchain-reader
          port: 22
        # A non-login shell usually has no ~/.local/bin on PATH, and that is
        # exactly where mise tends to live.
        misePath: /usr/local/bin/mise
    timeoutSec: 15
    maxConcurrency: 8
    expect:
      node: "22"
      python: "3.12"
caveats: >-
  A host that does not answer is recorded as unmeasured, and its counts stay
  null rather than dropping to zero. This matters more than it sounds: mise is
  routinely missing from a non-login shell's PATH, and a zero tool count from a
  host that never ran mise is indistinguishable from a host that is genuinely
  clean. Set `misePath` when a host records `failureKind: notfound`, which is
  mise missing from the PATH rather than a host missing from the network. A
  host that exits zero and hands back something other than the JSON that
  `ls --current` promises records `failureKind: unparseable` and stays
  unmeasured, because that is the probe the whole reading rests on. The
  follow-up subcommands are judged the same way but cost less: a wrong shape
  from `config ls` or `outdated`, a banner from `--version`, or unreadable
  text from `trust --show` names that subcommand in `failedSubcommands` and
  leaves the host measured-but-degraded rather than unmeasured.
  An unparseable answer is usually a login shell printing a banner over the
  top of the
  answer, so the repair belongs on the host. A host can also answer in part.
  When a follow-up subcommand goes quiet, or answers in a shape this model
  cannot read, the record is marked
  `degraded` and names it in `failedSubcommands`, and `nodesDegraded` on the
  summary counts how many hosts that happened to. Answering in a shape this
  model cannot read counts as going quiet: `mise --version` that returns a
  banner instead of a version, and `mise trust --show` that returns text with
  no readable line in it, both mark the host degraded even though they exited
  zero. A host can also answer in the right shape and still return individual
  entries no parser will vouch for -- a malformed tool row, an unreadable
  trust line, a name that screens as credential-bearing. Those are counted in
  `droppedEntries` rather than dropped in silence, and any count above zero
  marks the host degraded too. While `nodesDegraded` is above zero, read the
  drift totals as a floor rather than as everything there is to find. The
  summary goes one step further and refuses to add up totals it cannot stand
  behind: `outdated` and `configsNotInEffect` are null, not zero, whenever any
  host's contributing probe went unanswered. Zero is a fleet with no drift of
  that kind; null is a fleet where some of it was never measured.
  Tool rows carry the same flag as a `degraded` tag, so a query over
  rows alone cannot mistake a partial sweep for a clean one.
  mise config is directory-scoped, so `dir` decides which config is being
  judged. Leave it off and you measure the swamp working directory locally and
  the login directory over SSH, which is rarely the question you meant to ask.
  The node record's `dir` field names the directory the reading actually came
  from, so what a sweep judged is never left to guesswork. It is null in two
  cases: an ssh node with no `dir` set, where the reading comes from wherever
  the login lands, and a local node whose working directory could not be
  read, which is what a deleted working directory looks like.
  Trust is recorded but never treated as drift. A plain `[tools]` file reports
  as untrusted while applying perfectly, because mise only demands trust for
  configs that can execute something. `expect` can only police tools a host's
  own config declares. Hold the fleet to `{node: "22"}` and a host whose
  config never mentions node records no `expected` drift at all, which is not
  the same as passing. A tool no config on that host declares produces no
  record for that host at all, so its absence is invisible in the drift
  counts rather than surfacing under some other class. To hold a host to a
  tool, the tool has to be in that host's config. A full sweep deletes every
  stored record it did not write that time, with one exception worth knowing:
  a record is attributed to a host by the readable half of its name, and two
  host labels that normalize alike leave that attribution ambiguous. Such a
  record is deleted when every candidate host answered and held when they
  disagree, because keeping a stale row is recoverable by the next sweep that
  can attribute it and deleting a live one is not. Dropping a host from `nodes`
  removes its node record along with its tool and config rows. A run limited
  to one node with `--node` is a diagnostic and touches only that host. It
  deletes nothing, and it does not write the `summary` either, because one
  host's totals under a fleet-wide name would read as the fleet. The standing
  summary keeps its own `sweptAt`, which is the honest way to see how old it
  is. Node, tool, and config resource names
  all carry a hash suffix, so find them with `swamp data list <model>` rather
  than building the name by hand.
security: >-
  Read-only throughout. The model runs `ls --current`, `config ls`, `outdated`,
  `trust --show`, and `--version`, and nothing else. It never calls
  `mise install`, `mise upgrade`, `mise token`, `mise settings`, or `mise
  trust` without `--show`. Be precise about what that guarantees and what it
  does not: the argument list is fixed, so this model will not ask a host to
  change. It cannot promise the same about the binary that receives those
  arguments. `misePath` names an executable, and while its schema constrains
  the charset, refuses a leading dash and requires the basename to be exactly
  mise or mise.exe, a
  file called mise can be anything -- `/tmp/mise` passes. That is operator
  config, trusted the way the node list itself is trusted, and it is worth
  knowing it is trusted rather than verified. Point it at a mise you put
  there.
  Local hosts are invoked as an argv array that never reaches a shell. Over
  SSH, two operator-supplied values reach the remote command: `dir`,
  single-quoted, and `misePath`, unquoted. Each is safe because its schema
  refuses at parse time any value containing a character a shell would act on,
  rather than repairing it: a half-fixed path that measures the wrong
  directory silently is worse than a config error. `misePath` is held to one
  thing more: its basename has to be mise. The charset rule alone let it name
  any executable on the box, which is a guarantee this model advertises and
  was not actually keeping. `ssh.host` and `ssh.user`
  are a different case, and a stronger one. Neither reaches a shell at all.
  The two are combined into the single positional destination argument
  `user@host` and handed straight to `ssh` as one argv element, so the only
  first thing their schema refuses is a leading dash, which would otherwise
  let the destination be read as an ssh option such as `-oProxyCommand=`. It
  refuses more than that: both are held to hostname and username charsets, so
  an `@` or a `:` inside either cannot silently change which host is
  contacted.
  They carry
  no shell charset rule and do not need one. Node labels refuse terminal
  controls at parse time. Every string returned by a host is made printable
  before it reaches a resource field, tag, or log parameter. C0 and C1 bytes,
  including ESC, are written as visible `\uNNNN` text instead of being handed
  to a terminal. SSH passes both `BatchMode=yes` and
  `StrictHostKeyChecking=yes` on the command line, so an unknown host key fails
  closed. BatchMode alone would not do that: it removes the prompt but leaves
  the decision to ambient ssh_config, which can be set to accept a key it has
  never seen, and passing the policy as an argument beats any config file.
  `ProxyCommand` and `PermitLocalCommand` are set on the command line for the
  same reason and are the sharper case: both run a shell command, and ssh
  expands `%h` and `%u` into them, so an operator config written for
  interactive use would turn every value in the node list into local shell
  input. The
  same reasoning applies to what the connection hands the host rather than what
  it trusts about it: `ForwardAgent`, `ForwardX11`, `ForwardX11Trusted` and
  `ClearAllForwardings` are all set on the command line too. ssh inherits
  ambient config, and a `ForwardAgent` in the operator's `~/.ssh/config` --
  perfectly ordinary to have there for hosts you use interactively -- would
  otherwise expose the authentication agent to every host this model sweeps.
  An agent socket on a remote box signs for the key it holds, which for a fleet
  key is every host that trusts it. A read-only inventory probe has no business
  offering that.
  Errors never quote host output by default. stderr is read to classify a
  failure and then discarded; what is stored in `error` is one of a closed set
  of codes, `unparseable-output` among them for a host that exits zero without
  the JSON its subcommand promises.
  The `errorDetail` option turns that off and stores a bounded excerpt of the
  host's own text beside the code, for a private fleet whose datastore you own
  and need to debug. It covers unmeasured hosts only -- the probe that decides
  whether a host answered at all. A host that answered and then lost a
  follow-up probe is degraded rather than unmeasured, and names that probe in
  `failedSubcommands` instead of storing its text, so `errorDetail` on such a
  node is null even with the option on. It is off by default and should stay
  off wherever the
  datastore is shared, because host error text routinely carries
  credential-bearing URLs, tokens, private hostnames and home paths. The trade
  is real either way: with it off, a failure nobody wrote a pattern for reads
  as `unclassified` and the detail that would explain it is gone. Quoting
  even a truncated excerpt would publish whatever the host happened to print,
  which routinely includes URLs carrying credentials. Written data: host
  labels, the measured directory, mise version, tool names and versions,
  install paths, tool source types and source paths, and config file paths.
  Install and config paths embed the remote account's home directory and real
  project directory names. A source path is whatever registry or repository a
  tool came from, so it can name a private repository URL, an internal domain,
  Some of it also appears in readable form outside the resource data itself,
  and it is worth knowing exactly which: resource NAMES carry the host label,
  the tool name, and the config path; TAGS carry the host label, the tool
  name, the transport, and the measured, degraded and drift states. Install
  paths, source paths and versions appear in the data only. Credential-bearing
  values are withheld before any of that: a source or install URL carrying a
  username, a password, a query or a fragment is dropped rather than redacted,
  and a tool name or config path that screens the same way takes its whole
  entry with it. Screening is a set of shape rules, not a proof -- it catches
  the forms a credential usually takes, and a secret shaped like an ordinary
  path will pass. What remains is infrastructure detail regardless. Treat the
  datastore, and the sweep logs alongside it, as infrastructure-sensitive.
