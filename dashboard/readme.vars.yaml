package: "@jpisgeek/dashboard"
types:
  - "@jpisgeek/dashboard"
purpose: >-
  Renders explicit provider-neutral dashboard bundle v1 values as one
  self-contained, exceptions-first HTML status page. It performs no provider
  discovery and reaches no network. Missing, invalid, stale, partial,
  unsupported, and unauthorized inputs remain visible. Each exception is also
  written as a queryable resource.
example: |
  globalArguments:
    title: Operations
    bundles:
      - ${{ data.latest("netdata", "report-jpisgeek-dashboard-homelab-json").attributes }}
      - ${{ data.latest("truenas", "report-jpisgeek-dashboard-homelab-json").attributes }}
      - ${{ data.latest("firewalla", "report-jpisgeek-dashboard-homelab-json").attributes }}
    outputPath: ./dashboard/index.html
    suppress:
      - id: condition:accepted-maintenance
        reason: approved maintenance window
caveats: >-
  The renderer accepts bundle v1 only. Unsupported major versions and invalid
  values render as visible coverage exceptions instead of aborting or becoming
  healthy. It does not enumerate models or infer which adapters are installed.
  Delivery remains separate: compose the generated file with the transport
  model appropriate for the deployment.
security: >-
  No network, credentials, vault, process, environment, or cross-model
  repository access. Every bundle-derived string is HTML-escaped. Bundle
  sensitivity metadata does not itself enforce access control; protect any
  published dashboard according to the operational data it contains.
