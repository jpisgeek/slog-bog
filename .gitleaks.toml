# gitleaks configuration — extends the default ruleset, allowlists only the
# scanner's own test fixtures and two exact synthetic redaction-test values.
[extend]
useDefault = true

[allowlist]
description = "Deliberately dirty fixtures for scripts/test-scan.sh"
paths = [
  '''tests/fixtures/dirty/.*''',
  '''tests/fixtures/denylist\.sample\.txt''',
]

# Keep credential-shaped input in the redaction regressions without excluding
# the test file itself or accepting these values in any production source.
[[rules]]
id = "generic-api-key"
[[rules.allowlists]]
description = "Exact synthetic JWT-shaped redaction input in mise tests"
condition = "AND"
regexTarget = "secret"
paths = ['''(^|/)mise/mise_test[.]ts$''']
regexes = ['''^eyJhbGciOiJIUzI1NiJ9[.]secret[.]sig$''']

[[rules]]
id = "github-pat"
[[rules.allowlists]]
description = "Exact alternating-sequence fake GitHub token in mise tests"
condition = "AND"
regexTarget = "secret"
paths = ['''(^|/)mise/mise_test[.]ts$''']
regexes = ['''^ghp_[A]1b2C3d4E5f6G7h8I9j0K1l2M3n4O5p6Q7r8$''']
